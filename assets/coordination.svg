<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Weg eines sozialrechtlichen Anspruchs</title><desc id="desc">Von Lebenssituation und zuständiger Behörde über Rechtsprüfung und Leistungen bis zur Koordination mit anderen Systemen.</desc><rect width="1200" height="580" rx="28" fill="#fff8f9"/><g font-family="Arial,Helvetica,sans-serif"><text x="57" y="57" fill="#b42a45" letter-spacing="3" font-weight="bold" font-size="16">SOCIAL ATLAS · FALLLOGIK</text><text x="57" y="108" fill="#412331" font-size="34" font-weight="bold">Vom Lebensereignis zur Leistungsabklärung</text><text x="57" y="142" fill="#8f6f79" font-size="16">Eine Fallprüfung besteht aus mehreren unterscheidbaren Fragen.</text><g fill="#fff" stroke="#e9b8c3"><rect x="58" y="221" width="237" height="206" rx="17"/><rect x="339" y="221" width="237" height="206" rx="17"/><rect x="620" y="221" width="237" height="206" rx="17"/><rect x="901" y="221" width="237" height="206" rx="17"/></g><g fill="#b52844"><rect x="58" y="221" width="237" height="60" rx="17"/><rect x="339" y="221" width="237" height="60" rx="17"/><rect x="620" y="221" width="237" height="60" rx="17"/><rect x="901" y="221" width="237" height="60" rx="17"/></g><g fill="#fff" font-weight="bold" text-anchor="middle" font-size="20"><text x="176" y="258">1 · Situation</text><text x="457" y="258">2 · Recht</text><text x="739" y="258">3 · Anspruch</text><text x="1019" y="258">4 · Koordination</text></g><g fill="#6b4653" font-size="15" text-anchor="middle"><text x="176" y="328">Alter, Krankheit,</text><text x="176" y="353">Arbeitslosigkeit,</text><text x="176" y="378">Bedürftigkeit</text><text x="457" y="328">Gesetz und</text><text x="457" y="353">zuständige</text><text x="457" y="378">Behörde</text><text x="739" y="328">Voraussetzungen,</text><text x="739" y="353">Nachweise,</text><text x="739" y="378">Berechnung</text><text x="1019" y="328">Weitere Träger,</text><text x="1019" y="353">vorrangige Mittel,</text><text x="1019" y="378">Rechtsmittel</text></g><g fill="#c13750"><path d="M306 312 l22 0 l-11 -10 z"/><path d="M588 312 l22 0 l-11 -10 z"/><path d="M869 312 l22 0 l-11 -10 z"/></g><text x="600" y="491" text-anchor="middle" fill="#855d69" font-size="17">Prüfschritte können parallel laufen. Das Diagramm ist keine verbindliche Reihenfolge.</text><text x="57" y="544" fill="#9b7680" font-size="13">Die rechtliche Grundlage ist für jeden betroffenen Leistungszweig gesondert zu bestimmen.</text></g></svg>