<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Das Drei-Säulen-System der Schweizer Altersvorsorge</title><desc id="desc">Drei architektonische Säulen mit AHV und IV, BVG-Pensionskasse sowie privater Vorsorge 3a und 3b. EL sind als Ergänzung der ersten Säule aufgeführt.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f9"/><stop offset="1" stop-color="#fbe7eb"/></linearGradient><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b51b37"/><stop offset="1" stop-color="#e2495f"/></linearGradient><filter id="soft" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#9e2940" flood-opacity=".12"/></filter></defs><rect width="1200" height="620" rx="30" fill="url(#bg)"/><circle cx="1070" cy="80" r="175" fill="none" stroke="#e8a7b4" stroke-opacity=".23" stroke-width="65"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="65" fill="#b72b45" font-size="17" font-weight="bold" letter-spacing="4">SOCIAL ATLAS · INFOGRAFIK</text><text x="64" y="109" fill="#402330" font-size="34" font-weight="bold">Drei Säulen. Ein Vorsorgesystem.</text><text x="64" y="140" fill="#8c6874" font-size="16">Die Säulen ergänzen einander – mit unterschiedlichen Aufgaben und Finanzierungen.</text><path d="M125 224 L600 170 L1075 224 Z" fill="url(#head)" filter="url(#soft)"/><rect x="125" y="222" width="950" height="19" rx="8" fill="#9d1b33"/><text x="600" y="209" fill="#fff" font-size="19" text-anchor="middle" font-weight="bold">ALTER · TOD · INVALIDITÄT</text><g filter="url(#soft)"><rect x="128" y="259" width="292" height="246" rx="13" fill="#fff"/><rect x="454" y="259" width="292" height="246" rx="13" fill="#fff"/><rect x="780" y="259" width="292" height="246" rx="13" fill="#fff"/></g><rect x="128" y="259" width="292" height="65" rx="13" fill="#ad203a"/><rect x="128" y="300" width="292" height="24" fill="#ad203a"/><rect x="454" y="259" width="292" height="65" rx="13" fill="#c63f56"/><rect x="454" y="300" width="292" height="24" fill="#c63f56"/><rect x="780" y="259" width="292" height="65" rx="13" fill="#df7886"/><rect x="780" y="300" width="292" height="24" fill="#df7886"/><g fill="#fff" font-weight="bold" font-size="23" text-anchor="middle"><text x="274" y="300">1. SÄULE</text><text x="600" y="300">2. SÄULE</text><text x="926" y="300">3. SÄULE</text></g><g text-anchor="middle" fill="#563441"><text x="274" y="356" font-size="16" font-weight="bold">Staatliche Vorsorge</text><text x="274" y="391" font-size="19" font-weight="bold">AHV · IV</text><text x="274" y="419" font-size="15">EL als ergänzende Leistung</text><text x="274" y="452" font-size="14">Sicherung des Existenzbedarfs</text><text x="600" y="356" font-size="16" font-weight="bold">Berufliche Vorsorge</text><text x="600" y="391" font-size="19" font-weight="bold">BVG / Pensionskasse</text><text x="600" y="419" font-size="15">Obligatorisch und überobligatorisch</text><text x="600" y="452" font-size="14">Lebensstandard ergänzend sichern</text><text x="926" y="356" font-size="16" font-weight="bold">Private Vorsorge</text><text x="926" y="391" font-size="19" font-weight="bold">3a · 3b</text><text x="926" y="419" font-size="15">Gebunden oder frei</text><text x="926" y="452" font-size="14">Individuelle Ergänzung</text></g><g fill="#fef3f4"><rect x="155" y="475" width="238" height="17" rx="8"/><rect x="481" y="475" width="238" height="17" rx="8"/><rect x="807" y="475" width="238" height="17" rx="8"/></g><path d="M110 507 H1090" stroke="#bf465b" stroke-width="14" stroke-linecap="round"/><text x="600" y="553" text-anchor="middle" fill="#70434e" font-size="17">Gemeinsames Ziel: finanzielle Absicherung in unterschiedlichen Lebenslagen</text><text x="64" y="591" fill="#9c7880" font-size="13">Eigene didaktische Darstellung · Basis: Bundesamt für Sozialversicherungen</text></g></svg>