<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Europa – sechs Systeme und zwölf Vergleichsthemen</title><desc id="desc">Übersicht von Schweiz, Deutschland, Frankreich, Italien, Österreich und Liechtenstein; Vergleichsachsen orientieren sich an MISSOC.</desc><rect width="1200" height="660" rx="26" fill="#fff9fa"/><g font-family="Arial,Helvetica,sans-serif"><text x="53" y="60" fill="#b12740" font-size="16" font-weight="bold" letter-spacing="3">SOCIAL ATLAS · EUROPÄISCHER VERGLEICH</text><text x="53" y="105" fill="#40242f" font-size="34" font-weight="bold">Sechs Länder. Zwölf Themenfelder.</text><text x="53" y="138" fill="#8f7079" font-size="16">Gemeinsame Vergleichsfragen – unterschiedliche nationale Regeln.</text><g font-size="19" font-weight="bold" fill="#6a3747"><rect x="55" y="183" width="338" height="88" rx="15" fill="#fff" stroke="#f1cdd5"/><rect x="430" y="183" width="338" height="88" rx="15" fill="#fff" stroke="#f1cdd5"/><rect x="805" y="183" width="338" height="88" rx="15" fill="#fff" stroke="#f1cdd5"/><rect x="55" y="292" width="338" height="88" rx="15" fill="#fff" stroke="#f1cdd5"/><rect x="430" y="292" width="338" height="88" rx="15" fill="#fff" stroke="#f1cdd5"/><rect x="805" y="292" width="338" height="88" rx="15" fill="#fff" stroke="#f1cdd5"/><text x="88" y="237">CH · Schweiz</text><text x="463" y="237">DE · Deutschland</text><text x="838" y="237">FR · Frankreich</text><text x="88" y="346">IT · Italien</text><text x="463" y="346">AT · Österreich</text><text x="838" y="346">LI · Liechtenstein</text></g><path d="M600 383 V420" stroke="#c4475d" stroke-width="6"/><rect x="55" y="430" width="1088" height="157" rx="16" fill="#a8213b"/><text x="84" y="466" fill="#ffe2e8" font-size="15" font-weight="bold">VERGLEICHSBEREICHE NACH MISSOC</text><g font-size="14" fill="#fff"><text x="84" y="504">01 Finanzierung</text><text x="298" y="504">02 Gesundheitsversorgung</text><text x="585" y="504">03 Krankheit</text><text x="810" y="504">04 Mutterschaft</text><text x="84" y="533">05 Invalidität</text><text x="298" y="533">06 Alter</text><text x="585" y="533">07 Hinterlassene</text><text x="810" y="533">08 Arbeitsunfall</text><text x="84" y="562">09 Familie</text><text x="298" y="562">10 Arbeitslosigkeit</text><text x="585" y="562">11 Mindestsicherung</text><text x="810" y="562">12 Langzeitpflege</text></g><text x="53" y="631" fill="#987780" font-size="13">Quelle der Vergleichsstruktur: Europäische Kommission, MISSOC · Eigene grafische Darstellung</text></g></svg>